<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
  <title id="title">SIPU PE internal organization</title>
  <desc id="desc">Clean redrawn PE diagram showing RV cores, vector registers, Tile Core, Tile registers, L2B, L2C, command engine, TLSU, DTE, SFU, SIMD and fabric interfaces.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .rv { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .tile { fill: #ffedd5; stroke: #f97316; stroke-width: 2; }
      .mem { fill: #86efac; stroke: #15803d; stroke-width: 2; }
      .unit { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; }
      .cmd { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .bus { fill: none; stroke: #1f2937; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #1f2937; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1450" height="900" fill="#ffffff"/>
  <text x="725" y="44" class="title" text-anchor="middle">PE internal organization</text>
  <rect x="40" y="82" width="1370" height="760" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="80" y="116" class="title">PE</text>

  <g transform="translate(980 44)">
    <line x1="0" y1="24" x2="82" y2="24" stroke="#ef4444" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="100" y="30" class="small">config</text>
    <line x1="0" y1="58" x2="82" y2="58" stroke="#2563eb" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="100" y="64" class="small">command</text>
    <line x1="0" y1="92" x2="82" y2="92" stroke="#1f2937" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="100" y="98" class="small">data</text>
  </g>

  <rect x="95" y="135" width="110" height="34" class="box"/><text x="150" y="157" class="small" text-anchor="middle">Debug</text>
  <rect x="205" y="135" width="430" height="34" class="rv"/><text x="420" y="157" class="small" text-anchor="middle">RV Peripherals</text>
  <rect x="635" y="135" width="90" height="34" class="box"/><text x="680" y="157" class="small" text-anchor="middle">PLIC</text>
  <rect x="725" y="135" width="130" height="34" class="box"/><text x="790" y="157" class="small" text-anchor="middle">Timer</text>

  <rect x="120" y="218" width="590" height="150" class="rv"/>
  <text x="415" y="268" class="title" text-anchor="middle">RV-1 + Vector</text>
  <text x="415" y="304" class="small" text-anchor="middle">32 scalar int regs, 32 scalar fp regs, 32 vector regs</text>
  <rect x="372" y="324" width="78" height="30" class="cmd"/><text x="411" y="344" class="small" text-anchor="middle">ACE</text>
  <rect x="450" y="324" width="78" height="30" class="cmd"/><text x="489" y="344" class="small" text-anchor="middle">SCTL</text>
  <rect x="710" y="205" width="110" height="78" class="box"/><text x="765" y="242" class="small" text-anchor="middle">RV</text><text x="765" y="264" class="small" text-anchor="middle">uEngine</text>

  <rect x="920" y="140" width="100" height="34" class="cmd"/><text x="970" y="162" class="small" text-anchor="middle">PE Regs</text>
  <rect x="905" y="178" width="120" height="160" class="cmd"/>
  <text x="965" y="230" class="label" text-anchor="middle">Command</text>
  <text x="965" y="256" class="label" text-anchor="middle">Engine</text>
  <rect x="905" y="338" width="120" height="54" class="cmd"/>
  <text x="965" y="370" class="small" text-anchor="middle">TSYNC</text>
  <rect x="1110" y="135" width="120" height="168" class="mem"/>
  <text x="1170" y="215" class="label" text-anchor="middle">ICI</text>
  <text x="1170" y="240" class="label" text-anchor="middle">NIF</text>
  <rect x="1300" y="205" width="105" height="80" class="mem"/>
  <text x="1352" y="240" class="label" text-anchor="middle">ICI</text>
  <text x="1352" y="264" class="label" text-anchor="middle">Router</text>
  <path d="M 1230 220 H 1300" class="bus"/>

  <rect x="95" y="438" width="650" height="140" class="tile"/>
  <rect x="130" y="458" width="580" height="30" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
  <text x="420" y="479" class="small" text-anchor="middle">Tile Frontend</text>
  <rect x="130" y="498" width="580" height="38" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
  <text x="420" y="523" class="small" text-anchor="middle">Tile Regs: 256 TReg, 1024 Byte each</text>
  <rect x="130" y="540" width="580" height="28" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
  <text x="420" y="560" class="small" text-anchor="middle">Operand Collector</text>

  <rect x="120" y="635" width="230" height="120" class="unit"/>
  <text x="235" y="690" class="label" text-anchor="middle">Matrix</text>
  <text x="235" y="716" class="label" text-anchor="middle">Engine</text>
  <rect x="455" y="635" width="130" height="120" class="unit"/>
  <text x="520" y="704" class="label" text-anchor="middle">SFU</text>
  <rect x="690" y="635" width="150" height="120" class="unit"/>
  <text x="765" y="690" class="label" text-anchor="middle">Tile SIMD</text>
  <text x="765" y="716" class="label" text-anchor="middle">Engine</text>

  <rect x="900" y="430" width="170" height="54" class="mem"/><text x="985" y="463" class="label" text-anchor="middle">L2C</text>
  <rect x="900" y="535" width="170" height="56" class="mem"/><text x="985" y="570" class="label" text-anchor="middle">Tile Mem IF</text>
  <rect x="900" y="635" width="170" height="120" class="mem"/><text x="985" y="692" class="label" text-anchor="middle">Tile</text><text x="985" y="718" class="label" text-anchor="middle">LSU</text>
  <rect x="1120" y="635" width="190" height="120" class="mem"/><text x="1215" y="692" class="label" text-anchor="middle">Tile</text><text x="1215" y="718" class="label" text-anchor="middle">DTE</text>
  <rect x="95" y="775" width="1210" height="42" class="mem"/>
  <text x="700" y="803" class="label" text-anchor="middle">L2B local SRAM buffer, 1-4MB</text>

  <path d="M 415 368 V 438" class="bus"/>
  <path d="M 620 368 C 710 420, 820 424, 900 457" class="bus"/>
  <path d="M 905 258 C 820 300, 760 338, 710 438" class="bus"/>
  <path d="M 745 520 H 900" class="bus"/>
  <path d="M 985 484 V 535" class="bus"/>
  <path d="M 985 591 V 635" class="bus"/>
  <path d="M 1070 665 H 1120" class="bus"/>
  <path d="M 1215 635 V 303 H 1110" class="dash"/>
  <path d="M 235 755 V 775" class="bus"/>
  <path d="M 520 755 V 775" class="bus"/>
  <path d="M 765 755 V 775" class="bus"/>
  <path d="M 985 755 V 775" class="bus"/>
  <path d="M 1215 755 V 775" class="bus"/>
  <text x="650" y="870" class="small" text-anchor="middle">RV cores drive control flow; Tile Core and DTE/TLSU/SFU/TMAC units use explicit buffers and synchronization to keep pipelines fed.</text>
</svg>
