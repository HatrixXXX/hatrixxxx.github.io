allowBuilds:
  esbuild: true

# GHSA-ch52-4w7c-c8xp: http-cache-semantics has no patched release and is only
# pulled in by Astro's static build toolchain; no shared HTTP cache is deployed.
# Remove this exception when Astro resolves to a patched release.
audit:
  ignore:
    - GHSA-ch52-4w7c-c8xp

overrides:
  # GHSA-r5fr-rjxr-66jc: Chevrotain pins a vulnerable lodash-es version.
  'lodash-es@<4.18.1': 4.18.1
  # GHSA-68fv-2mgg-jv7q: use the patched transitive source-map-js release.
  'source-map-js@<1.2.2': 1.2.2
