<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">粉色与深蓝色的抽象几何背景</title>
  <desc id="description">由渐变光晕、网格和细线构成的博客默认题图</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="0.55" stop-color="#242032"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8fa6" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ff8fa6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#fff" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="350" cy="200" rx="460" ry="370" fill="url(#glow)" filter="url(#blur)" opacity=".54"/>
  <ellipse cx="1320" cy="720" rx="520" ry="410" fill="url(#glow)" filter="url(#blur)" opacity=".42"/>
  <g fill="none" stroke="#ffb1c0" stroke-opacity=".32">
    <path d="M-60 650C260 350 490 780 810 480s530-180 850-470" stroke-width="3"/>
    <path d="M-80 730C240 430 540 840 860 540s510-150 800-430"/>
  </g>
  <g fill="#fff" fill-opacity=".42">
    <circle cx="271" cy="298" r="3"/>
    <circle cx="1050" cy="205" r="2"/>
    <circle cx="1312" cy="395" r="3"/>
    <circle cx="820" cy="690" r="2"/>
  </g>
</svg>
