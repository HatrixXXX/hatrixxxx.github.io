name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [blogs-updated, snippets-updated, sanctuary-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HATRIX_BLOGS_DIR: tests/fixtures/private-blogs
      HATRIX_SNIPPETS_DIR: tests/fixtures/private-snippets
      HATRIX_SANCTUARY_DIR: tests/fixtures/private-sanctuary
      HATRIX_ADMIN_KEY: test-admin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Find pnpm store
        shell: bash
        run: echo "STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level high

      - name: Run unit tests
        run: corepack pnpm test:run

      - name: Check Astro types
        run: corepack pnpm check

      - name: Build fixture site
        run: corepack pnpm build

      - name: Check fixture built site
        run: corepack pnpm exec tsx scripts/check-built-site.ts --fixtures

  build-production:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HATRIX_BLOGS_DIR: .private-blogs
      HATRIX_SNIPPETS_DIR: .private-snippets
      HATRIX_SANCTUARY_DIR: .private-sanctuary
    steps:
      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require production secrets
        shell: bash
        env:
          HATRIX_ADMIN_KEY: ${{ secrets.HATRIX_ADMIN_KEY }}
          HATRIX_CONTENT_TOKEN: ${{ secrets.HATRIX_CONTENT_TOKEN }}
          HATRIX_SNIPPETS_DEPLOY_KEY: ${{ secrets.HATRIX_SNIPPETS_DEPLOY_KEY }}
          HATRIX_PLANS_DEPLOY_KEY: ${{ secrets.HATRIX_PLANS_DEPLOY_KEY }}
        run: |
          if [[ -z "$HATRIX_ADMIN_KEY" ]]; then
            echo "::error::Required secret HATRIX_ADMIN_KEY is not configured."
            exit 1
          fi
          if (( ${#HATRIX_ADMIN_KEY} < 8 )); then
            echo "::error::Required secret HATRIX_ADMIN_KEY is shorter than 8 characters."
            exit 1
          fi
          if [[ -z "$HATRIX_CONTENT_TOKEN" ]]; then
            echo "::error::Required secret HATRIX_CONTENT_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "$HATRIX_SNIPPETS_DEPLOY_KEY" ]]; then
            echo "::error::Required secret HATRIX_SNIPPETS_DEPLOY_KEY is not configured."
            exit 1
          fi
          if [[ -z "$HATRIX_PLANS_DEPLOY_KEY" ]]; then
            echo "::error::Required secret HATRIX_PLANS_DEPLOY_KEY is not configured."
            exit 1
          fi

      - name: Validate dispatched blogs SHA
        if: github.event.action == 'blogs-updated'
        shell: bash
        env:
          DISPATCH_BLOGS_SHA: ${{ github.event.client_payload.blogs_sha }}
        run: |
          if [[ ! "$DISPATCH_BLOGS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Dispatched blogs SHA must be a 40-character hexadecimal commit."
            exit 1
          fi

      - name: Checkout dispatched private blogs
        if: github.event.action == 'blogs-updated'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HatrixXXX/hatrix-blogs
          token: ${{ secrets.HATRIX_CONTENT_TOKEN }}
          ref: ${{ github.event.client_payload.blogs_sha }}
          path: .private-blogs
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout latest private blogs
        if: github.event.action != 'blogs-updated'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HatrixXXX/hatrix-blogs
          token: ${{ secrets.HATRIX_CONTENT_TOKEN }}
          path: .private-blogs
          fetch-depth: 1
          persist-credentials: false

      - name: Validate dispatched snippets SHA
        if: github.event.action == 'snippets-updated'
        shell: bash
        env:
          DISPATCH_SNIPPETS_SHA: ${{ github.event.client_payload.snippets_sha }}
        run: |
          if [[ ! "$DISPATCH_SNIPPETS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Dispatched snippets SHA must be a 40-character hexadecimal commit."
            exit 1
          fi

      - name: Checkout dispatched private snippets
        if: github.event.action == 'snippets-updated'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HatrixXXX/hatrix-snippets
          ssh-key: ${{ secrets.HATRIX_SNIPPETS_DEPLOY_KEY }}
          ref: ${{ github.event.client_payload.snippets_sha }}
          path: .private-snippets
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout latest private snippets
        if: github.event.action != 'snippets-updated'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HatrixXXX/hatrix-snippets
          ssh-key: ${{ secrets.HATRIX_SNIPPETS_DEPLOY_KEY }}
          path: .private-snippets
          fetch-depth: 1
          persist-credentials: false

      - name: Record private blogs SHA
        id: blogs
        shell: bash
        env:
          DISPATCH_TYPE: ${{ github.event.action }}
          DISPATCH_BLOGS_SHA: ${{ github.event.client_payload.blogs_sha }}
        run: |
          blogs_sha="$(git -C .private-blogs rev-parse HEAD)"
          if [[ ! "$blogs_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Checked-out blogs SHA is not a 40-character hexadecimal commit."
            exit 1
          fi
          if [[ "$DISPATCH_TYPE" == "blogs-updated" && "$blogs_sha" != "$DISPATCH_BLOGS_SHA" ]]; then
            echo "::error::Checked-out blogs SHA does not match the dispatch payload."
            exit 1
          fi
          echo "sha=$blogs_sha" >> "$GITHUB_OUTPUT"

      - name: Record private snippets SHA
        id: snippets
        shell: bash
        env:
          DISPATCH_TYPE: ${{ github.event.action }}
          DISPATCH_SNIPPETS_SHA: ${{ github.event.client_payload.snippets_sha }}
        run: |
          snippets_sha="$(git -C .private-snippets rev-parse HEAD)"
          if [[ ! "$snippets_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Checked-out snippets SHA is not a 40-character hexadecimal commit."
            exit 1
          fi
          if [[ "$DISPATCH_TYPE" == "snippets-updated" && "$snippets_sha" != "$DISPATCH_SNIPPETS_SHA" ]]; then
            echo "::error::Checked-out snippets SHA does not match the dispatch payload."
            exit 1
          fi
          echo "sha=$snippets_sha" >> "$GITHUB_OUTPUT"

      - name: Validate dispatched sanctuary SHA
        if: github.event.action == 'sanctuary-updated'
        shell: bash
        env:
          DISPATCH_SANCTUARY_SHA: ${{ github.event.client_payload.sanctuary_sha }}
        run: |
          if [[ ! "$DISPATCH_SANCTUARY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Dispatched sanctuary SHA must be a 40-character hexadecimal commit."
            exit 1
          fi

      - name: Checkout dispatched private sanctuary
        if: github.event.action == 'sanctuary-updated'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HatrixXXX/hatrix-sanctuary
          ssh-key: ${{ secrets.HATRIX_PLANS_DEPLOY_KEY }}
          ref: ${{ github.event.client_payload.sanctuary_sha }}
          path: .private-sanctuary
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout latest private sanctuary
        if: github.event.action != 'sanctuary-updated'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HatrixXXX/hatrix-sanctuary
          ssh-key: ${{ secrets.HATRIX_PLANS_DEPLOY_KEY }}
          path: .private-sanctuary
          fetch-depth: 1
          persist-credentials: false

      - name: Record private sanctuary SHA
        id: sanctuary
        shell: bash
        env:
          DISPATCH_TYPE: ${{ github.event.action }}
          DISPATCH_SANCTUARY_SHA: ${{ github.event.client_payload.sanctuary_sha }}
        run: |
          sanctuary_sha="$(git -C .private-sanctuary rev-parse HEAD)"
          if [[ ! "$sanctuary_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Checked-out sanctuary SHA must be a 40-character hexadecimal commit."
            exit 1
          fi
          if [[ "$DISPATCH_TYPE" == "sanctuary-updated" && "$sanctuary_sha" != "$DISPATCH_SANCTUARY_SHA" ]]; then
            echo "::error::Checked-out sanctuary SHA does not match the dispatch payload."
            exit 1
          fi
          echo "sha=$sanctuary_sha" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Find pnpm store
        shell: bash
        run: echo "STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level high

      - name: Run unit tests
        run: corepack pnpm test:run

      - name: Check Astro types
        run: corepack pnpm check

      - name: Build site
        env:
          HATRIX_ADMIN_KEY: ${{ secrets.HATRIX_ADMIN_KEY }}
        run: corepack pnpm build

      - name: Check built site
        run: corepack pnpm check:site

      - name: Remove secret-bearing Astro build state
        if: always()
        shell: bash
        run: rm -rf -- .astro

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: build-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
